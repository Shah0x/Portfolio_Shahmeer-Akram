<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="dp.jpeg" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/contact.css">
    <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
    <title>Contact Me | Shahmeer Akram</title>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M15 19l-7-7 7-7" />
                </svg>
                <span class="back-text">Back to Home</span>
            </a>
            <h1>Contact Me</h1>
            <p class="subtitle">Let's connect and build something great together.</p>
        </div>
    </header>
    <main>
        <div class="container">
            <div class="content-wrapper">
                <div class="form-section">
                    <div class="form-container">
                        <form action="mailto:shahmeerx002@gmail.com" method="post" enctype="text/plain"
                            class="contact-form">
                            <div class="form-group">
                                <label for="name">Your Name</label>
                                <input type="text" id="name" name="name" class="form-input" placeholder="Shahmeer Akram"
                                    required>
                            </div>
                            <div class="form-group">
                                <label for="email">Your Email</label>
                                <input type="email" id="email" name="email" class="form-input"
                                    placeholder="example@email.com" required>
                            </div>
                            <div class="form-group">
                                <label for="message">Your Message</label>
                                <textarea id="message" name="message" class="form-textarea"
                                    placeholder="I'd love to chat about..." required></textarea>
                            </div>
                            <button type="submit" class="submit-btn">
                                Send Message
                            </button>
                        </form>
                    </div>
                </div>
                <div class="contact-info-section">
                    <div class="contact-info-container">
                        <h2 class="section-title">Direct Contact</h2>
                        <div class="contact-items">
                            <div class="contact-item">
                                <i class="fas fa-envelope contact-icon"></i>
                                <div class="contact-details">
                                    <h3>Email</h3>
                                    <a href="mailto:shahmeerx002@gmail.com">shahmeerx002@gmail.com</a>
                                </div>
                            </div>
                            <div class="contact-item">
                                <i class="fas fa-map-marker-alt contact-icon"></i>
                                <div class="contact-details">
                                    <h3>Location</h3>
                                    <p>Karachi, Pakistan</p>
                                </div>
                            </div>
                            <div class="contact-item">
                                <i class="fas fa-phone-alt contact-icon"></i>
                                <div class="contact-details">
                                    <h3>Phone</h3>
                                    <a href="tel:+92 3101262202">+92 3101262202</a>
                                </div>
                            </div>
                        </div>
                        <div class="social-section">
                            <h2 class="section-title">Find Me Online</h2>
                            <div class="social-links">
                                <a href="https://github.com/Shah0x" target="_blank" class="social-link">
                                    <i class="fab fa-github"></i>
                                </a>
                                <a href="https://www.linkedin.com/in/shahmeer-akram" target="_blank"
                                    class="social-link">
                                    <i class="fab fa-linkedin"></i>
                                </a>
                                <a href="mailto:shahmeerx002@gmail.com" class="social-link">
                                    <i class="fas fa-envelope"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 | Designed by <strong>Shahmeer Akram</strong></p>
        </div>
    </footer>
    <script src="assets/js/email.js"></script>
</body>
</html>
